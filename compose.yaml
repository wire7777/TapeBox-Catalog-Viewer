services:

  catalog-viewer:

    build:
      context: .

    container_name: tapebox-catalog-viewer

    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "8081:8081"

    environment:
      TAPEBOX_CATALOG_URL: "${TAPEBOX_CATALOG_URL:-http://tapebox:8080/api/catalog-mirror/download}"

    volumes:
      - ./data:/app/data

    restart: unless-stopped


  catalog-sync:

    build:
      context: .

    container_name: tapebox-catalog-sync

    user: "${PUID:-1000}:${PGID:-1000}"

    command:
      - python
      - -u
      - -m
      - viewer.auto_sync

    environment:
      TAPEBOX_CATALOG_URL: "${TAPEBOX_CATALOG_URL:-http://tapebox:8080/api/catalog-mirror/download}"
      TAPEBOX_SYNC_INTERVAL_SECONDS: "300"

    volumes:
      - ./data:/app/data

    restart: unless-stopped
